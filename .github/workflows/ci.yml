name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fallow needs history to resolve the merge-base
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx vp check
      - name: Tests with coverage
        run: bunx vp test --run --coverage
      - name: fallow audit
        run: bunx fallow audit --format github-annotations
